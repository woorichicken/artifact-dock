<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsDocTitle">Artifact Dock</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <style>
    body { display: block; padding: 24px; max-width: 620px; margin: 0 auto; height: auto; font-size: 14px; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 8px; }
    .field { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .field label { flex: 1; cursor: pointer; }
    .field .desc { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    select, input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
    .saved { color: var(--accent); font-size: 12px; opacity: 0; transition: opacity .2s; }
    .saved.on { opacity: 1; }
    .setup-link { color: var(--accent); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Artifact Dock</h1>
  <p class="muted"><span data-i18n="optLead"></span> <span id="saved" class="saved" data-i18n="optSaved"></span></p>
  <p><a id="setupLink" class="setup-link" href="welcome.html" data-i18n="optSetupLink"></a></p>

  <h2 data-i18n="optSecDup"></h2>
  <div class="field">
    <label for="dedupe"><span data-i18n="optDedupe"></span>
      <span class="desc" data-i18n="optDedupeDesc"></span></label>
    <input type="checkbox" id="dedupe" />
  </div>
  <div class="field">
    <label for="matchMode"><span data-i18n="optMatch"></span>
      <span class="desc" data-i18n-html="optMatchDesc"></span></label>
    <select id="matchMode">
      <option value="path" data-i18n="optMatchPath"></option>
      <option value="filename" data-i18n="optMatchFilename"></option>
      <option value="title" data-i18n="optMatchTitle"></option>
    </select>
  </div>
  <div class="field">
    <label for="reloadOnDuplicate"><span data-i18n="optReload"></span>
      <span class="desc" data-i18n="optReloadDesc"></span></label>
    <input type="checkbox" id="reloadOnDuplicate" />
  </div>

  <h2 data-i18n="optSecFocus"></h2>
  <div class="field">
    <label for="focusGuard"><span data-i18n="optFocusGuard"></span>
      <span class="desc" data-i18n="optFocusGuardDesc"></span></label>
    <input type="checkbox" id="focusGuard" />
  </div>

  <h2 data-i18n="optSecGroup"></h2>
  <div class="field">
    <label for="autoGroup"><span data-i18n="optAutoGroup"></span>
      <span class="desc" data-i18n="optAutoGroupDesc"></span></label>
    <input type="checkbox" id="autoGroup" />
  </div>
  <div class="field">
    <label for="groupTitle"><span data-i18n="optGroupTitle"></span></label>
    <input type="text" id="groupTitle" />
  </div>
  <div class="field">
    <label for="groupColor"><span data-i18n="optGroupColor"></span></label>
    <select id="groupColor">
      <option>grey</option><option>blue</option><option>red</option><option>yellow</option>
      <option>green</option><option>pink</option><option>purple</option><option>cyan</option><option>orange</option>
    </select>
  </div>
  <div class="field">
    <label for="viewMode"><span data-i18n="optViewMode"></span>
      <span class="desc" data-i18n-html="optViewModeDesc"></span></label>
    <select id="viewMode">
      <option value="solo" data-i18n="optViewSolo"></option>
      <option value="expand" data-i18n="optViewExpand"></option>
    </select>
  </div>
  <div class="field">
    <label for="collapseGroup"><span data-i18n="optCollapse"></span>
      <span class="desc" data-i18n="optCollapseDesc"></span></label>
    <input type="checkbox" id="collapseGroup" />
  </div>

  <div class="field">
    <label for="sweepOnStart"><span data-i18n="optSweepOnStart"></span>
      <span class="desc" data-i18n="optSweepOnStartDesc"></span></label>
    <input type="checkbox" id="sweepOnStart" />
  </div>

  <div class="field">
    <label for="maxOpenTabs"><span data-i18n="optMaxTabs"></span>
      <span class="desc" data-i18n="optMaxTabsDesc"></span></label>
    <input type="number" id="maxOpenTabs" min="0" max="200" step="1" style="width:72px" />
  </div>

  <h2 data-i18n="optSecTarget"></h2>
  <div class="field">
    <label for="trackClaudeArtifacts"><span data-i18n="optTrackClaude"></span>
      <span class="desc" data-i18n-html="optTrackClaudeDesc"></span></label>
    <input type="checkbox" id="trackClaudeArtifacts" />
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
