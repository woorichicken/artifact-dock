<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artifact Dock</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="bar">
    <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false" />
    <button id="agentPrompt" class="icon-btn" data-i18n-title="agentPromptBtn">🤖</button>
    <button id="settings" class="icon-btn" data-i18n-title="settingsTitle">⚙</button>
  </header>

  <button id="hostStatus" class="host-status" hidden></button>

  <main id="list" class="list" aria-live="polite"></main>

  <footer class="bar foot">
    <span id="count" class="muted"></span>
    <span class="foot-actions">
      <button id="sweep" class="ghost" data-i18n="sweep" data-i18n-title="sweepTitle"></button>
      <button id="closeAll" class="ghost" data-i18n="closeAll" data-i18n-title="closeAllTitle"></button>
    </span>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
